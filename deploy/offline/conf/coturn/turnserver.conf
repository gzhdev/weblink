# 内网 STUN/TURN。部署前把 10.0.0.10 改成服务器内网 IP，
# 账号密码与构建时 TURN_SERVERS 中的保持一致。

listening-port=3478
listening-ip=10.0.0.10
relay-ip=10.0.0.10

# 中继端口区间，每个走中继的客户端占用一个端口；防火墙需同步放行 UDP
min-port=49160
max-port=49200

fingerprint
lt-cred-mech
user=weblink:ChangeMe-Strong
realm=weblink.intra.local

no-tls
no-dtls
no-cli
no-multicast-peers
no-loopback-peers

log-file=stdout
simple-log
